name: Unit Tests

on: [ push, pull_request ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'yarn'
    -   run: yarn install --frozen-lockfile
    -   run: npx webpack
    -   run: yarn run test
    -   uses: codecov/codecov-action@v7

